variables:
  PYTHON_VERSION: "3.12"
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

stages:
  - test
  - deploy

default:
  image: astral/uv:python$PYTHON_VERSION-$BASE_LAYER
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential curl git
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source ~/.cargo/env
    - cargo install cargo-llvm-cov --locked

lint:
  stage: test
  script:
    - uv sync --group lint --extra cpu
    - make lint
  tags:
    - no-gpu

cpu-pytest:
  stage: test
  script:
    - uv sync --group test --extra cpu
    - make cpu-test
    - mv .coverage .coverage.cpu
  artifacts:
    paths:
      - .coverage.cpu
  tags:
    - no-gpu
    - GenuineIntel


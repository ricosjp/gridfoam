# gridfoam config file
# Transient (PIMPLE) flow around a circular cylinder at Re=100.
# Matched conditions with the OpenFOAM pimpleFoam case under
# examples/cylinder/openfoam. The domain, mesh refinement, viscosity and
# time stepping are identical so that the von Karman vortex shedding can be
# compared directly between the two solvers.
version: 0.3.0

# Parameters
inlet_speed: &inlet_speed 1.0
flow_velocity: &flow_velocity [*inlet_speed, 0.0, 0.0]

# Fluxel config (mesh generation)
fluxel:
  domain:
    lower: [-8.0, -4.0, -4.0]
    upper: [16.0, 4.0, 4.0]
  root_resolution: [24, 8, 8]
  target_level: 2
  n_leaf_refinement: 2
  mesh_path: "examples/cylinder/gridfoam/data/cylinder.stl"
  ibm_type: axis_projected
  motion: static
  refinement_regions:
    - name: refinement_box
      min: [-2.0, -2.0, -2.0]
      max: [6.0, 2.0, 2.0]
      level: 2

# Simulator config (simulation settings)
simulator:
  # Control settings corresponding to system/controlDict
  control:
    deltaT: 0.05
    endTime: 150
    writeInterval: 100
    output:
      output_dir: "examples/cylinder/gridfoam/outputs"
      base_name: "cylinder"
      overwrite_file: true
    precision: float64
  # Fv schemes settings corresponding to system/fvSchemes
  fvSchemes:
    divSchemes:
      default: upwind
  # Fv solution settings corresponding to system/fvSolution
  fvSolution:
    adjustPhi: true  # OpenFOAM adjustPhi: scale adjustable outlet fluxes
    algorithm:
      type: pimple
      nNonOrthogonalCorrectors: 1
      nCorrectors: 2
      nOuterCorrectors: 2
      residualControl:
        U: 1e-5
        p: 1e-5
      pRefCell: 0
      pRefValue: 0.0
      consistent: false  # OpenFOAM PIMPLE consistent formulation
    potentialFlow:  # OpenFOAM potentialFoam initialization (optional)
      nNonOrthogonalCorrectors: 10
    solvers:
      U:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 0.1
        max_iter: 1000
        norm_type: l_2
      Phi:
        method: cg
        preconditioner: jacobi
        tolerance: 1e-7
        rel_tolerance: 0.01
        max_iter: 1000
        norm_type: l_2
      p:
        method: cg
        preconditioner: jacobi
        tolerance: 1e-7
        rel_tolerance: 0.01
        max_iter: 1000
        norm_type: l_2
      pFinal:  # last inner corrector, last non-orthogonal pass
        method: cg
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 0.0
        max_iter: 1000
        norm_type: l_2
  # Conditions corresponding to 0.orig
  conditions:
      U:
        # Optional SI base exponents (T, L, M, I, Theta, N, J).
        # Must match solver defaults when both are set (velocity: L/T).
        dimension: {L: 1, T: -1}
        internal: *flow_velocity
        boundary:
          inlet:
            type: dirichlet
            patches: [x_minus]
            value: *flow_velocity
          outlet:
            type: inlet_outlet
            patches: [x_plus]
            value: [0.0, 0.0, 0.0]
          farfield:
            type: slip
            patches: [y_minus, y_plus, z_minus, z_plus]
          wall:
            type: dirichlet
            patches: [_default]
            value: [0.0, 0.0, 0.0]
      p:
        # Kinematic pressure (p/rho): L^2/T^2
        dimension: {L: 2, T: -2}
        internal: 0.0
        boundary:
          inlet:
            type: neumann
            patches: [x_minus]
            value: 0.0
          outlet:
            type: dirichlet
            patches: [x_plus]
            value: 0.0
          farfield:
            type: neumann
            patches: [y_minus, y_plus, z_minus, z_plus]
            value: 0.0
          wall:
            type: neumann
            patches: [_default]
            value: 0.0
  # Properties settings corresponding to constant/properties
  properties:
    transport:
      type: newtonian
      nu: 0.01  # Re = magU_ref * D / nu = 1.0 * 1.0 / 0.01 = 100
    turbulence:
      type: laminar
  # Post processing settings
  post_processing:
    continuityError:
      phi: "phi"
    solverInfo:
      fields: [U, p]
    forceCoeff:
      patches: [_default]
      rho: 1.0
      magU_ref: *inlet_speed
      A_ref: 8.0
      L_ref: 1.0
      local_coord:
        drag_dir: [1.0, 0.0, 0.0]
        lift_dir: [0.0, 1.0, 0.0]
        center_of_rotation: [0.0, 0.0, 0.0]
  # Device settings
  device: cuda

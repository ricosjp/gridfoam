# Translating square prism on a fixed background mesh.
# Rest pose [0.4, 0.6] x [0.4, 0.6]; U_wall = (1.5, 0, 0) for 0.20
# (travel 0.30). The refinement corridor covers that path so update_ib
# can refresh IBM data without leaving target_level.
version: 0.3.0

inlet_speed: &inlet_speed 1.0
body_speed: &body_speed 1.5
flow_velocity: &flow_velocity [*inlet_speed, 0.0, 0.0]
body_velocity: &body_velocity [*body_speed, 0.0, 0.0]

fluxel:
  domain:
    lower: [0.0, 0.0, 0.0]
    upper: [2.0, 1.0, 0.1]
  root_resolution: [16, 8, 1]
  target_level: 2
  n_leaf_refinement: 0
  mesh_path: "examples/dynamic_motions/update_ib/data/cube.stl"
  ibm_type: axis_projected
  motion: dynamic
  refinement_regions:
    - name: travel_corridor
      min: [0.25, 0.25, 0.0]
      max: [1.10, 0.75, 0.1]
      level: 2

simulator:
  control:
    deltaT: 0.01
    endTime: 0.20
    writeInterval: 5
    output:
      output_dir: "examples/dynamic_motions/update_ib/outputs"
      base_name: "update_ib"
      overwrite_file: true
    precision: float64
  fvSchemes:
    divSchemes:
      default: upwind
  fvSolution:
    adjustPhi: true
    algorithm:
      type: piso
      nNonOrthogonalCorrectors: 0
      nCorrectors: 2
      pRefCell: 0
      pRefValue: 0.0
    solvers:
      U:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-5
        rel_tolerance: 0.0
        max_iter: 500
        norm_type: l_2
      p:
        method: cg
        preconditioner: jacobi
        tolerance: 1e-6
        rel_tolerance: 0.05
        max_iter: 1000
        norm_type: l_2
      pFinal:
        method: cg
        preconditioner: jacobi
        tolerance: 1e-6
        rel_tolerance: 0.0
        max_iter: 1000
        norm_type: l_2
  conditions:
    U:
      # Optional SI base exponents (T, L, M, I, Theta, N, J).
      # Must match solver defaults when both are set (velocity: L/T).
      dimension: {L: 1, T: -1}
      internal: *flow_velocity
      boundary:
        inlet:
          type: dirichlet
          patches: [x_minus]
          value: *flow_velocity
        outlet:
          type: inlet_outlet
          patches: [x_plus]
          value: [0.0, 0.0, 0.0]
        farfield:
          type: slip
          patches: [y_minus, y_plus]
        empty:
          type: empty
          patches: [z_minus, z_plus]
        wall:
          type: dirichlet
          patches: [_default]
          value: *body_velocity
    p:
      # Kinematic pressure (p/rho): L^2/T^2
      dimension: {L: 2, T: -2}
      internal: 0.0
      boundary:
        inlet:
          type: neumann
          patches: [x_minus]
          value: 0.0
        outlet:
          type: dirichlet
          patches: [x_plus]
          value: 0.0
        farfield:
          type: neumann
          patches: [y_minus, y_plus]
          value: 0.0
        empty:
          type: empty
          patches: [z_minus, z_plus]
        wall:
          type: fixed_flux_pressure
          patches: [_default]
  properties:
    transport:
      type: newtonian
      nu: 0.01
    turbulence:
      type: laminar
  device: cpu

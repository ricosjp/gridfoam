# gridfoam config file
version: 0.0.1

# Fluxel config (mesh generation)
fluxel:
  domain:
    lower: [0.0, 0.0, 0.0]
    upper: [20.0, 8.0, 1.0]
  root_resolution: [40, 16, 1]
  target_level: 0
  n_leaf_refinement: 0
  mesh_path: null
  ibm_type: axis_projected
  motion: static

# Simulator config (simulation settings)
simulator:
  # Control settings corresponding to system/controlDict
  control:
    deltaT: 0.1
    endTime: 200
    writeInterval: 100
    output:
      output_dir: "examples/hagen_poiseuille/gridfoam/outputs"
      base_name: "hagen_poiseuille"
      overwrite_file: true
    precision: float64
  fvSchemes:
    divSchemes:
      default: upwind
  fvSolution:
    adjustPhi: true  # OpenFOAM adjustPhi: scale adjustable outlet fluxes
    algorithm:
      type: piso
      nNonOrthogonalCorrectors: 0
      nCorrectors: 2
      pRefCell: 0
      pRefValue: 0.0
    solvers:
      U:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 0.1
        max_iter: 1000
        norm_type: l_2
      p:
        method: cg
        preconditioner: jacobi
        tolerance: 1e-7
        rel_tolerance: 0.01
        max_iter: 2000
        norm_type: l_2
      pFinal:  # final pressure-correction solver (OpenFOAM pFinal)
        method: cg
        preconditioner: jacobi
        tolerance: 1e-7
        rel_tolerance: 0.0
        max_iter: 2000
        norm_type: l_2
  # Conditions corresponding to 0.orig
  conditions:
    U:
      # Optional SI base exponents (T, L, M, I, Theta, N, J).
      # Must match solver defaults when both are set (velocity: L/T).
      dimension: {L: 1, T: -1}
      internal: [0.0, 0.0, 0.0]
      boundary:
        flow:
          type: neumann
          patches: [x_minus, x_plus]
          value: [0.0, 0.0, 0.0]
        wall:
          type: dirichlet
          patches: [y_minus, y_plus]
          value: [0.0, 0.0, 0.0]
        empty:
          type: empty
          patches: [z_minus, z_plus]
    p:
      # Kinematic pressure (p/rho): L^2/T^2
      dimension: {L: 2, T: -2}
      internal: [0.0]
      boundary:
        inflow:
          type: dirichlet
          patches: [x_minus]
          value: [2.0]
        outflow:
          type: dirichlet
          patches: [x_plus]
          value: [0.0]
        wall:
          type: neumann
          patches: [y_minus, y_plus]
          value: [0.0]
        empty:
          type: empty
          patches: [z_minus, z_plus]
  # Properties settings corresponding to constant/properties
  properties:
    transport:
      type: newtonian
      nu: 0.1
    turbulence:
      type: laminar
  # Device settings
  device: cpu
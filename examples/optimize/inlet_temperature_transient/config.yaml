# gridfoam config file
version: 0.3.0

# Fluxel config (mesh generation)
fluxel:
  domain:
    lower: [0.0, 0.0, 0.0]
    upper: [2.0, 0.5, 0.1]
  root_resolution: [8, 4, 1]
  target_level: 0
  n_leaf_refinement: 0
  mesh_path: null
  ibm_type: axis_projected
  motion: static

# Simulator config (simulation settings)
# Prescribed uniform channel flow. Walls at T=0 cool the fluid downstream.
# PisoStepMap does not carry T; this example unrolls fvm.ddt + transport.
# Use run.py --n-opt / --n-time / --lr for the optimization loop.
simulator:
  control:
    deltaT: 0.25
    endTime: 2.0
    writeInterval: 1
    output:
      output_dir: "examples/optimize/inlet_temperature_transient/outputs"
      base_name: "inlet_temperature_transient"
      overwrite_file: true
    precision: float64
  fvSchemes:
    ddtSchemes:
      default: euler
    divSchemes:
      default: upwind
  fvSolution:
    algorithm:
      type: manual
    solvers:
      U:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 1e-5
        max_iter: 500
        norm_type: l_2
      T:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-10
        rel_tolerance: 1e-8
        max_iter: 3000
        max_restart: 20
        norm_type: l_2
  conditions:
    U:
      physical_dimension: {L: 1, T: -1}
      internal: [1.0, 0.0, 0.0]
      boundary:
        inlet:
          type: dirichlet
          patches: [x_minus]
          value: [1.0, 0.0, 0.0]
        outlet:
          type: inlet_outlet
          patches: [x_plus]
          value: [0.0, 0.0, 0.0]
        slip_wall:
          type: slip
          patches: [y_minus, y_plus]
          value: [0.0, 0.0, 0.0]
        empty:
          type: empty
          patches: [z_minus, z_plus]
    T:
      internal: 0.0
      boundary:
        inlet:
          type: dirichlet
          patches: [x_minus]
          value: 0.0
        outlet:
          type: neumann
          patches: [x_plus]
          value: 0.0
        cooled_wall:
          type: dirichlet
          patches: [y_minus, y_plus]
          value: 0.0
        empty:
          type: empty
          patches: [z_minus, z_plus]
      export: true
  properties:
    transport:
      type: newtonian
      nu: 0.1  # Used as scalar diffusivity alpha in this transport demo.
    turbulence:
      type: laminar
  device: cpu

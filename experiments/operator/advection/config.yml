fluxel:
  domain:
    lower: [-5.0, -4.0, 0.0]
    upper: [11.0, 4.0, 4.0]
  root_resolution: [8, 4, 2]
  target_level: 2
  n_leaf_refinement: 2
  ibm_type: axis_projected
  refinement_regions:
    - name: refinement_box1
      min: [-3.0, -4.0, 0.0]
      max: [7.0, 4.0, 4.0]
      level: 1
    - name: refinement_box2_1
      min: [-1.0, -2.0, 0.0]
      max: [5.0, 2.0, 3.0]
      level: 2
    - name: refinement_box2_2
      min: [-2.0, -2.0, 0.0]
      max: [0.0, 2.0, 2.0]
      level: 2
    - name: refinement_box3_1
      min: [0.0, -1.5, 0.0]
      max: [4.5, 1.5, 2.0]
      level: 3
    - name: refinement_box3_2
      min: [-1.5, -1.5, 0.0]
      max: [4.5, 1.5, 2.0]
      level: 3
    - name: refinement_box4
      min: [0.25, -1.0, 0.0]
      max: [4.0, 1.0, 1.75]
      level: 4
simulator:
  control:
    deltaT: 0.01
    endTime: 1.0
    writeInterval: 10
    output:
      output_dir: "experiments/operator/advection/outputs"
      base_name: "advection"
      overwrite_file: true
    precision: float64
  fvSchemes:
    divSchemes:
      default: superbee
  fvSolution:
    solvers:
      momentum:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 1e-5
        max_iter: 2000
        norm_type: l_2
      temperature:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 1e-5
        max_iter: 2000
        norm_type: l_2
  boundaryConditions:
    U:
      - name: inlet
        type: dirichlet
        patches: [x_minus]
        value: [0.707, 0.0, -0.707]
      - name: outlet
        type: inlet_outlet
        patches: [x_plus]
        value: [0.0, 0.0, 0.0]
      - name: slip_wall
        type: slip
        patches: [y_minus, y_plus, z_plus, z_minus]
    T:
      - name: inlet
        type: dirichlet
        patches: [x_minus]
        value: [0.0]
      - name: outlet
        type: neumann
        patches: [x_plus]
        value: [0.0]
      - name: slip_wall
        type: slip
        patches: [y_minus, y_plus, z_plus, z_minus]
  properties:
    nu: 0.1
  device: cuda

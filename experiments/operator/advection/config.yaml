# gridfoam config file
version: 0.0.1

# Fluxel config (mesh generation)
fluxel:
  domain:
    lower: [-5.0, -4.0, 0.0]
    upper: [11.0, 4.0, 4.0]
  root_resolution: [8, 4, 2]
  target_level: 2
  n_leaf_refinement: 2
  ibm_type: axis_projected
  motion: static
  refinement_regions:
    - name: refinement_box1
      min: [-3.0, -4.0, 0.0]
      max: [7.0, 4.0, 4.0]
      level: 1
    - name: refinement_box2_1
      min: [-1.0, -2.0, 0.0]
      max: [5.0, 2.0, 3.0]
      level: 2
    - name: refinement_box2_2
      min: [-2.0, -2.0, 0.0]
      max: [0.0, 2.0, 2.0]
      level: 2
    - name: refinement_box3_1
      min: [0.0, -1.5, 0.0]
      max: [4.5, 1.5, 2.0]
      level: 3
    - name: refinement_box3_2
      min: [-1.5, -1.5, 0.0]
      max: [4.5, 1.5, 2.0]
      level: 3
    - name: refinement_box4
      min: [0.25, -1.0, 0.0]
      max: [4.0, 1.0, 1.75]
      level: 4

# Simulator config (simulation settings)
simulator:
  # Control settings corresponding to system/controlDict
  control:
    deltaT: 0.01
    endTime: 1.0
    writeInterval: 10
    output:
      output_dir: "experiments/operator/advection/outputs"
      base_name: "advection"
      overwrite_file: true
    precision: float64
  fvSchemes:
    divSchemes:
      default: limitedlinear
  fvSolution:
    algorithm:
      type: manual
    solvers:
      U:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 1e-5
        max_iter: 2000
        norm_type: l_2
      T:
        method: bicgstab
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 1e-5
        max_iter: 2000
        norm_type: l_2
  # Conditions corresponding to 0.orig
  conditions:
    U:
      # Optional SI base exponents (T, L, M, I, Theta, N, J).
      # Must match solver defaults when both are set (velocity: L/T).
      dimension: {L: 1, T: -1}
      internal: [0.707, 0.0, -0.707]
      boundary:
        inlet:
          type: dirichlet
          patches: [x_minus]
          value: [0.707, 0.0, -0.707]
        outlet:
          type: inlet_outlet
          patches: [x_plus]
          value: [0.0, 0.0, 0.0]
        slip_wall:
          type: slip
          patches: [y_minus, y_plus, z_plus, z_minus]
    T:
      internal: [0.0]
      boundary:
        inlet:
          type: dirichlet
          patches: [x_minus]
          value: [0.0]
        outlet:
          type: neumann
          patches: [x_plus]
          value: [0.0]
        slip_wall:
          type: slip
          patches: [y_minus, y_plus, z_plus, z_minus]
  # Properties settings corresponding to constant/properties
  properties:
    transport:
      type: newtonian
      nu: 0.1
    turbulence:
      type: laminar
  # Device settings
  device: cuda

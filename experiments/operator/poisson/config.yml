# Static example of config.j2 at n_leaf_refinement=1.
# poisson.py renders config.j2 for each requested refinement level.
# gridfoam config file
version: 0.3.0

# Fluxel config (mesh generation)
fluxel:
  domain:
    lower: [-1.0, -1.0, -1.0]
    upper: [1.0, 1.0, 1.0]
  root_resolution: [2, 2, 2]
  target_level: 2
  n_leaf_refinement: 1
  ibm_type: axis_projected
  motion: static

# Simulator config (simulation settings)
simulator:
  # Control settings corresponding to system/controlDict
  control:
    deltaT: 0.01
    endTime: 1.0
    writeInterval: 10
    output:
      output_dir: "experiments/operator/poisson/outputs"
      base_name: "poisson"
      overwrite_file: true
    precision: float64
  # Fv schemes settings corresponding to system/fvSchemes
  fvSchemes:
    divSchemes:
      default: upwind
  # Fv solution settings corresponding to system/fvSolution
  fvSolution:
    algorithm:
      type: manual
    solvers:
      p:
        method: cg
        preconditioner: jacobi
        tolerance: 1e-8
        rel_tolerance: 1e-5
        max_iter: 2000
        norm_type: l_2
  # Conditions settings corresponding to 0.orig
  conditions:
    p:
      internal: 0.0
      boundary:
        wall:
          type: dirichlet
          patches: [x_minus, x_plus, y_minus, y_plus, z_minus, z_plus]
          value: 0.0
  # Properties settings corresponding to constant/properties
  properties:
    transport:
      type: newtonian
      nu: 1.0
    turbulence:
      type: laminar
  # Device settings corresponding to system/device
  device: cuda

grid:
  domain:
    lower: [-4.0, -2.0, -2.0]
    upper: [4.0, 2.0, 2.0]
  blocksize: [8, 4, 4]
  
octree:
  refinement:
    strategy: "default"
    depth_limit: 3
    alpha: 0.3

simulator:
  control:
    deltaT: 0.1
    endTime: 1.0
    writeInterval: 1
  fvSchemes:
    ddt:
      offset_coefficient: 0.9
    div:
      scheme: "default"

io:
  output_dir: "tests/outputs/grid"
  mode: "cell"
  only_leaves: true
  overwrite_file: true

mesh:
  file: "tests/data/stl/bunny.stl"

cube:
  interior_width: 8
  halo_width: 2

device: "cpu"

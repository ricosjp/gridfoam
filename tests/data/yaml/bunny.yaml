cubion:
  grid:
    domain:
      lower: [-2.0, -2.0, -2.0]
      upper: [2.0, 2.0, 2.0]
    blocksize: [2, 2, 2]

  octree:
    refinement:
      strategy: "default"
      depth_limit: 2
      alpha: 0.3

gridfoam:
  simulator:
    control:
      deltaT: 0.1
      endTime: 5.0
      writeInterval: 1
    fvSchemes:
      ddtSchemes:
        default: Euler
      divSchemes:
        default: Upwind
        div(U, T): Upwind
      laplacianSchemes:
        default: GaussLinear
        laplacian(nu, T): GaussLinear
      gradSchemes:
        default: GaussLinear
        grad(p): GaussLinear
    fvSolution:
      solvers:
        heat_diffusion: # equation tag
          method: BiCGSTAB
        # momentum: # equation tag
        #   method: BiCGSTAB
        # poisson: # equation tag
        #   method: CG
  io:
    output_dir: "tests/outputs/grid"
    base_name: "bunny"
    only_leaves: true
    overwrite_file: true

  mesh:
    file: "tests/data/stl/bunny.stl"

  cube:
    interior_width: 8
    halo_width: 2
    device: "cpu"

grid:
  domain:
    lower: [-4.0, -2.0, -2.0]
    upper: [4.0, 2.0, 2.0]
  blocksize: [8, 4, 4]
  
octree:
  refinement:
    strategy: "default"
    depth_limit: 3
    alpha: 0.3
  
io:
  output_dir: "tests/outputs/grid"
  mode: "cell"
  only_leaves: true
  overwrite_file: true

mesh:
  file: "tests/data/stl/bunny.stl"

cube:
  width: 8
  bnd_width: 2

device: "cpu"

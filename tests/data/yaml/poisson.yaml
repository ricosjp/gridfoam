cubion:
  grid:
    domain:
      lower: [-1.0, -1.0, -1.0]
      upper: [1.0, 1.0, 1.0]
    blocksize: [2, 2, 2]

  octree:
    refinement:
      strategy: "default"
      depth_limit: 2
      alpha: 0.3

gridfoam:
  simulator:
    control:
      deltaT: 0.1
      endTime: 1.0
      writeInterval: 1
    fvSchemes:
      ddtSchemes:
        default:
          scheme: Euler
      divSchemes:
        default:
          mode: implicit
          # mode: explicit
          scheme: upwind
        div(U, T):
          scheme: upwind   # upwind, MUSCL, QUICK…
      laplacianSchemes:
        default:
          scheme: GaussLinear
        laplacian(nu, T):
          scheme: GaussLinear
      gradSchemes:
        default:
          scheme: GaussLinear
        grad(p):
          scheme: GaussLinear
    fvSolution:
      solvers:
        heat: # equation tag
          type: BiCGSTAB
        momentum: # equation tag
          type: BiCGSTAB
        poisson: # equation tag
          type: CG
  io:
    output_dir: "tests/outputs/grid"
    mode: "cell"
    only_leaves: true
    overwrite_file: true

  mesh:
    file: "tests/data/stl/DrivAer.stl"

  cube:
    interior_width: 8
    halo_width: 2
    device: "cpu"

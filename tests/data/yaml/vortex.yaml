cubion:
  grid:
    domain:
      lower: [0.0, 0.0, 0.0]
      upper: [1.0, 1.0, 0.1]
    blocksize: [2, 2, 1]

  octree:
    refinement:
      strategy: "default"
      depth_limit: 4
      alpha: 0.3

gridfoam:
  simulator:
    control:
      deltaT: 0.1
      endTime: 5.0
      writeInterval: 1
    fvSchemes:
      ddtSchemes:
        default: Euler
      divSchemes:
        div(phi, T): LimitedLinear
        # div(phi, T): Upwind
      laplacianSchemes:
        default: GaussLinear
        laplacian(nu, T): GaussLinear
      gradSchemes:
        default: GaussLinear
        grad(p): GaussLinear
    fvSolution:
      solvers:
        heat_diffusion: # equation tag
          method: BiCGSTAB
  io:
    output_dir: "tests/outputs/grid"
    base_name: "vortex"
    only_leaves: true
    overwrite_file: true

  mesh:
    file: "tests/data/stl/circle.stl"

  cube:
    interior_width: 8
    halo_width: 2
    device: "cpu"

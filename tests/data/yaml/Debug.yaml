cubion:
  grid:
    domain:
      lower: [-5.0, -4.0, 0.0]
      upper: [11.0, 4.0, 4.0]
    blocksize: [8, 4, 2]

  octree:
    refinement:
      strategy: "default"
      depth_limit: 2
      alpha: 0.3

gridfoam:
  simulator:
    control:
      deltaT: 0.1
      endTime: 1.0
      writeInterval: 1
    fvSchemes:
      ddtSchemes:
        default:
          scheme: Euler
      divSchemes:
        default:
          mode: implicit
          # mode: explicit
          scheme: upwind
        div(U, T):
          mode: implicit
          # mode: explicit
          scheme: upwind   # upwind, MUSCL, QUICK…
      laplacianSchemes:
        default:
          # mode: implicit
          mode: explicit
          scheme: GaussLinear
        laplacian(nu, T):
          # mode: implicit
          mode: explicit
          scheme: GaussLinear  # 2点中心 (面フラックス: Gauss積分 + 線形補間)
    fvSolution:
      solvers:
        heat: # equation tag
          type: BiCGSTAB
  io:
    output_dir: "tests/outputs/grid"
    mode: "cell"
    only_leaves: true
    overwrite_file: true

  mesh:
    file: "tests/data/stl/DrivAer.stl"

  cube:
    interior_width: 8
    halo_width: 2

  device: "cpu"

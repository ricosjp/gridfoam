grid:
  domain:
    lower: [-5.0, -4.0, 0.0]
    upper: [11.0, 4.0, 4.0]
  blocksize: [8, 4, 2]
  
octree:
  refinement:
    strategy: "default"
    depth_limit: 4
    alpha: 0.3

simulator:
  control:
    deltaT: 0.1
    endTime: 1.0
    writeInterval: 1
  fvSchemes:
    ddt:
      offset_coefficient: 0.9
    div:
      scheme: "default"
  
io:
  output_dir: "tests/outputs/grid"
  mode: "cell"
  only_leaves: true
  overwrite_file: true

mesh:
  file: "tests/data/stl/DrivAer.stl"

cube:
  interior_width: 8
  halo_width: 2

device: "cpu"

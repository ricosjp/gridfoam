grid:
  domain:
    lower: [-5.0, -4.0, 0.0]
    upper: [11.0, 4.0, 4.0]
  blocksize: [8, 4, 2]
  
octree:
  refinement:
    strategy: "default"
    depth_limit: 4
    alpha: 0.3
  
io:
  output_dir: "tests/outputs/grid"
  mode: "cell"
  only_leaves: true
  overwrite_file: true

mesh:
  file: "tests/data/stl/DrivAer.stl"

cube:
  width: 8
  bnd_width: 2

device: "cpu"

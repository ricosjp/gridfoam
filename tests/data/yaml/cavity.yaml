cubion:
  grid:
    domain:
      lower: [0.0, 0.0, 0.0]
      upper: [0.1, 0.1, 0.1]
    blocksize: [1, 1, 1]

  octree:
    refinement:
      strategy: "default"
      depth_limit: 3
      alpha: 0.3

gridfoam:
  simulator:
    control:
      deltaT: 0.0005
      endTime: 0.5
      writeInterval: 10
    fvSchemes:
      ddtSchemes:
        default: Euler
      divSchemes:
        default: Upwind
        # div(phi, U): LimitedLinearV
      laplacianSchemes:
        default: GaussLinear
        laplacian(nu, T): GaussLinear
      gradSchemes:
        default: GaussLinear
        grad(p): GaussLinear
    fvSolution:
      solvers:
        momentum:
          method: BiCGSTAB
        poisson:
          method: CG
          norm_type: L_inf
          max_iter: 2000
  io:
    output_dir: "tests/outputs/grid/cavity"
    base_name: "cavity"
    only_leaves: true
    overwrite_file: true

  mesh:
    file: "tests/data/stl/cavity.stl"

  cube:
    interior_width: 8
    halo_width: 2
    device: "cpu"

grid:
  domain:
    lower: [8.0, -2.0, -2.0] # lower must be less than upper
    upper: [4.0, 2.0, 2.0]
  blocksize: [0, 4, 4] # blocksize must be greater than 0

octree:
  refinement:
    strategy: "default"
    depth_limit: 6
    alpha: 0.3
  
io:
  output_dir: "tests/outputs/grid"
  only_leaves: true

mesh:
  file: "tests/data/stl/bunny.stl"

device: "cpu"
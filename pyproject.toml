[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridfoam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daichi Ishida", email = "ishida@ricos.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "pyvista>=0.44.2",
    "torch>=2.6.0",
    "scipy>=1.15.1",
    "nanofoam",
    "h5py>=3.13.0",
    "vtk>=9.3.1",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-benchmark",
  "pytest-memray",
]
lint = [
  "ruff",
  "mypy"
]
docs = [
  "sphinx",
  "furo",
  "sphinx-fontawesome",
  "sphinx-gallery",
  "sphinx-design",
  "sphinx-copybutton",
]
note = [
  "ipykernel",
  "nbstripout>=0.8.1",
  "trame",
  "trame-vtk",
  "trame-vuetify",
  "imageio>=2.37.0",
]

[tool.uv]
default-groups = ["dev", "lint", "docs", "note"]

[tool.uv.sources]
nanofoam = { path = "./src/nanofoam", editable = true }

[tool.pytest.ini_options]
markers = [
    "with_benchmark: Run test with the --benchmark-autosave option",
    "with_memray: Run test with the --memray option",
    "with_device: Run test with the --gpu option",
]
addopts = [
    "--import-mode=importlib",
    "-m",
    "not with_benchmark and not with_memray",
]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

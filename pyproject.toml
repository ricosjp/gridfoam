[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/gridfoam",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "gridfoam"
version = "0.3.0"
description = "Differentiable Fluid Solver of Hierarchical Grid"
readme = "README.md"
authors = [{name = "RICOS Co. Ltd."}]
maintainers = [
    { name = "Daichi Ishida", email = "ishida@ricos.co.jp" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
]
dependencies = [
    "pyvista>=0.44.2",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
    "phlower-tensor>=0.1.0",
    "fluxel-cfd>=0.2.0,<0.3.0",
    "pyamg>=5.3.0",
    "beartype",
    "jaxtyping",
]

[project.optional-dependencies]
cpu = ["torch>=2.5.1", "torchvision>=0.20.1"]
cu118 = ["torch>=2.5.1", "torchvision>=0.20.1"]
cu124 = ["torch>=2.5.1", "torchvision>=0.20.1"]
graphlow = [
    "graphlow @ git+https://github.com/ricosjp/graphlow.git@develop",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "experiments" },
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-memray",
    "pyinstrument",
]
lint = [
    "ruff",
    "basedpyright",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-gallery",
    "sphinx-copybutton",
    "numpydoc",
    "sphinxcontrib-mermaid",
    "sphinx-codeautolink",
    "imageio",                            # gif animation
]
experiments = [
    "mlflow",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu118" }, { extra = "cu124" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu124", extra = "cu124" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: Run test with the --benchmark-autosave option",
    "profile: Run test with memray / pyinstrument",
    "slow: Run slow test (10s+)",
]
addopts = [
    "--import-mode=importlib",
    "-m",
    "not benchmark and not profile and not slow",
]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.basedpyright]
include = ["src", "tests", "examples"]
exclude = ["lib", "reference", "experiments", "docs"]
reportAny = false
reportExplicitAny = false
reportImportCycles = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
reportPrivateLocalImportUsage = false
reportPrivateImportUsage = false
reportUnnecessaryComparison = false
reportUnannotatedClassAttribute = false
reportUnreachable = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedCallResult = false
reportConstantRedefinition = false

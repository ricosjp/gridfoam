[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridfoam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daichi Ishida", email = "ishida@ricos.co.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "pyvista>=0.44.2",
    "torch>=2.6.0",
    "pydantic>=2.11.7",
    "h5py>=3.14.0",
    "nanofoam",
    "trimesh>=4.7.1",
    "rtree>=1.4.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-benchmark",
  "pytest-memray",
  "pyinstrument",
  "polars",
  "plotly",
]
lint = [
  "ruff",
  "jaxtyping",
  "beartype",
]
docs = [
  "sphinx",
  "furo",
  "sphinx-fontawesome",
  "sphinx-gallery",
  "sphinx-design",
  "sphinx-copybutton",
]
note = [
  "ipykernel",
  "ipywidgets",
  "nbstripout>=0.8.1",
  "trame",
  "trame-vtk",
  "trame-vuetify",
  "imageio>=2.37.0",
]

[tool.uv]
default-groups = ["dev", "lint", "docs", "note"]

[tool.uv.sources]
nanofoam = { path = "./src/nanofoam", editable = true }

[tool.pytest]
testpaths = ["tests"]

[tool.pytest.ini_options]
markers = [
    "with_benchmark: Run test with pytest-benchmark",
    "with_profile: Run test with memray / pyinstrument",
    "with_device: Run test on cuda device",
]
addopts = [
    "--import-mode=importlib",
    "-m",
    "not with_benchmark and not with_profile",
]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
